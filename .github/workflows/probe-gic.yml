name: Probe GIC data sources
# One-off diagnostic: checks which public magnetometer / geoelectric sources respond and how fresh they are.
# Result is written to the "probe" branch (probe.json). Run it from Actions > Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe_gic.py
      - name: Save result to the probe branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cp probe.json publish/
          cd publish
          git init -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Probe $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe
