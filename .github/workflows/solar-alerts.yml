name: Solar alerts feed

# Runs the alert script every 5 minutes, publishes feed.xml to GitHub Pages when it
# changed, and keeps the de-duplication database on an orphan "state" branch.
#
# One-time setup: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  schedule:
    - cron: "3-58/5 * * * *"        # every 5 min, offset from the congested top of the hour
  workflow_dispatch:                 # "Run workflow" button
  push:                              # publish immediately after you edit thresholds or code
    branches: [main]
    paths:
      - config.toml
      - test_config.toml
      - solar_alerts.py
      - test_solar_alerts.py
      - site_static/**
      - .github/workflows/solar-alerts.yml

permissions:
  contents: write                    # state branch + keepalive commit
  pages: write
  id-token: write

# Never run two cycles at once (they would race on the state branch).
concurrency:
  group: solar-alerts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state from the state branch
        run: |
          mkdir -p state site
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:solar_alerts.db > state/solar_alerts.db || rm -f state/solar_alerts.db
            git show FETCH_HEAD:feed.xml > previous-feed.xml || rm -f previous-feed.xml
            cp state/solar_alerts.db previous.db 2>/dev/null || true
            echo "Restored previous state."
          else
            echo "No state branch yet - first run."
          fi

      - name: Validate config, then run tests (only when code or config changed)
        if: github.event_name == 'push'
        run: |
          # A mistyped value (e.g. text where a number belongs) stops here with a clear message,
          # and nothing is published. Any valid threshold passes: tests use test_config.toml.
          python solar_alerts.py --check-config
          python -m unittest -v

      - name: Check for new alerts
        run: python solar_alerts.py --config config.toml -v

      - name: Add landing page
        run: cp site_static/* site/

      - name: Decide whether to publish and save state
        id: diff
        run: |
          publish=false
          save=false
          # Publish when the feed changed, or when code/config/landing page was pushed.
          if [ ! -f previous-feed.xml ] || ! cmp -s previous-feed.xml site/feed.xml \
             || [ "${{ github.event_name }}" = "push" ]; then
            publish=true
          fi
          # Save state when the database content or the feed changed.
          dump_hash() { python3 -c 'import sqlite3,sys,hashlib; c=sqlite3.connect(sys.argv[1]); print(hashlib.sha256("\n".join(c.iterdump()).encode()).hexdigest())' "$1"; }
          new_hash=$(dump_hash state/solar_alerts.db)
          old_hash=$( [ -s previous.db ] && dump_hash previous.db || echo none )
          if [ "$new_hash" != "$old_hash" ] || [ ! -f previous-feed.xml ] \
             || ! cmp -s previous-feed.xml site/feed.xml; then
            save=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "save=$save" >> "$GITHUB_OUTPUT"
          echo "publish=$publish save=$save"

      # Publish first; state is saved only after a successful deploy, so a failed
      # deploy means the same alerts are simply detected again on the next run.
      - name: Package site
        if: steps.diff.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.diff.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

      - name: Save state to the state branch
        if: steps.diff.outputs.save == 'true'
        run: |
          rm -rf publish && mkdir publish
          cp state/solar_alerts.db site/feed.xml publish/
          cd publish
          git init -q -b state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "State $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Single orphan commit, force-pushed: the branch never accumulates history.
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

      # GitHub disables scheduled workflows in public repos after 60 days without
      # repository activity. Best effort: add an empty commit to main every ~45 days.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "Keepalive: prevent scheduled workflow auto-disable"
            git push -q origin HEAD:${{ github.event.repository.default_branch }} \
              || echo "::warning::Keepalive push failed (branch protection?). Push any commit within 60 days."
          fi
