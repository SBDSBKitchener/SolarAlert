# Solar & Geomagnetic Alerts RSS - configuration
# Re-read on every polling cycle: edit, save, and the next run uses the new values.
# Check your edits with:  python3 solar_alerts.py --check-config

[feed]
title = "Solar & Geomagnetic Alerts"
description = "Significant solar flares, solar eruptions, geomagnetic storms, radiation storms, solar wind shocks and power-grid risk. WATCH = worth keeping an eye on; WARNING = a significant event is likely or under way; ALERT = an extreme event. Times are UTC."
link = "https://SBDSBKitchener.github.io/SolarAlert/"            # human-facing page (GitHub Pages URL)
self_url = "https://SBDSBKitchener.github.io/SolarAlert/feed.xml"  # public URL of the feed itself
output_path = "site/feed.xml"                              # published directory (GitHub Pages deploys site/)
max_items = 100
max_age_days = 14
ttl_minutes = 5

[runtime]
database = "state/solar_alerts.db"
user_agent = "solar-alerts-rss/1.0 (+https://github.com/SBDSBKitchener/SolarAlert)"   # public contact sent to NOAA/HEK
http_timeout_seconds = 20
retention_days = 90          # how long alerts stay in the database

[hek]
url = "https://www.lmsal.com/hek/her"

# ---------------------------------------------------------------- SOLAR EVENTS
# "Earth-facing" is judged from the event's Stonyhurst heliographic longitude
# (0 = disk centre, +/-90 = limb).
#   |lon| <= full_facing_max_longitude     -> "Earth-facing"
#   |lon| <= partial_facing_max_longitude  -> "partially Earth-facing (near limb)"
# unknown_location: "ignore" or "alert" when HEK has no position for the event yet.

# Earth-facing flares are reported at one of two levels, judged by GOES class against the thresholds for the
# flare's TYPE (so impulsive and long-duration flares can be given different thresholds later):
#   WARNING  class >= warning_min_class          ALERT  class >= alert_min_class
# A class of "off" disables that level for that type. Defaults: M5.0 and above is a WARNING, X1.0 and above an ALERT.
# Type comes from the HEK start/end times: duration >= long_duration_min_minutes is "long-duration", shorter is
# "impulsive". Until a flare's end is reported its type is "pending" and it is assumed impulsive: judged by the
# impulsive thresholds only. Long-duration thresholds apply once the flare is known to be long-duration (its end
# was reported after long_duration_min_minutes, or it is still going after that long), when a new alert (or an
# update, if it had already been reported as impulsive) is issued.
# Positions come from HEK (hgs_x/hgs_y); events with no position are handled by unknown_location.

[flares]
enabled = true
long_duration_min_minutes = 60
lookback_hours = 12
full_facing_max_longitude = 60
partial_facing_max_longitude = 90
unknown_location = "ignore"
link = "https://www.swpc.noaa.gov/products/goes-x-ray-flux"

[flares.impulsive]
warning_min_class = "X3.0"
alert_min_class = "X5.0"

[flares.long_duration]
# X1.5 is the same strength as the January 2026 flare that produced aurora at 15 degrees latitude.
warning_min_class = "X1.5"
alert_min_class = "X3.0"

[filaments]
enabled = true
lookback_hours = 24
full_facing_max_longitude = 60
partial_facing_max_longitude = 90
unknown_location = "ignore"
link = "https://sdo.gsfc.nasa.gov/data/"

# ---------------------------------------------------------------- SUNSPOTS
# Flags potentially dangerous sunspot regions. A region is flagged when it is Earth-facing
# (within max_longitude degrees of disk centre) AND at least one of the attributes
# below are met. No single attribute is required: a region with no flare history, or without a
# delta field, is still flagged if it meets enough of the others.
#
#   dangerous_classes          magnetic (Hale) classes, exact match, case-insensitive. "BGD" =
#                              beta-gamma-delta. Add "GD" / "BD" if wanted. [] turns this off.
#   growth_area_min_increase   rapid growth: sunspot area up by at least this many millionths of
#                              the solar hemisphere per day versus the region's previous daily
#                              record. 0 turns it off.
#   growth_spots_min_increase  rapid growth: number of spots up by at least this many per day. 0 = off.
#   growth_window_days         the previous record may be at most this many days older.
#   mcintosh_classes           rapid growth counts ONLY for regions whose McIntosh class (NOAA's
#                              "spot_class", e.g. Fkc) is in this list; case-insensitive. [] turns
#                              the growth attribute off. Other attributes are not affected.
#   x_flare_probability_min    NOAA's X-class flare probability (%), alert when >= this. 0 = off.
#                              (NOAA's M-class probability is deliberately not used.)
#   flare_history_min_events   M- plus X-class flares already reported for the region in its latest
#                              daily record, alert when >= this. 0 = off.
#
# Source: NOAA Solar Region Summary, updated about once a day, so alerts lag by up to ~24 h.
# max_age_days: ignore a region whose latest record is older than this.
# A region alerts once per episode. While it stays flagged you get one further alert whenever an
# attribute is met that was not yet announced ("update: now also ..."); an attribute is announced
# at most once per episode. After it stops being flagged and cooldown_minutes has passed, the next
# episode announces everything again.

[sunspots]
enabled = true
url = "https://services.swpc.noaa.gov/json/solar_regions.json"
max_longitude = 60
dangerous_classes = ["BGD"]
growth_area_min_increase = 100
growth_spots_min_increase = 10
growth_window_days = 2
mcintosh_classes = ["Fkc", "Ekc", "Eki", "Fki"]
x_flare_probability_min = 10
flare_history_min_events = 1
max_age_days = 3
cooldown_minutes = 1440
link = "https://www.swpc.noaa.gov/products/solar-region-summary"

# Alert level of each attribute: "watch", "warning", "alert" or "off". A region's alert takes the highest
# level among the attributes it meets. Levels: WATCH = conditions favourable (fast-growing Earth-facing spot),
# WARNING = elevated flare risk (X-flare chance), ALERT = an event has happened (an X-class flare; see [flares]).
[sunspots.levels]
growth = "watch"
class = "watch"
xprob = "warning"
flares = "watch"

# ---------------------------------------------------------------- GEOMAGNETIC

[geomagnetic.coronal_hole]
enabled = true
url = "https://services.swpc.noaa.gov/text/discussion.txt"
# A sentence of the SWPC forecast discussion triggers an alert only if it names a stream AND
# announces an arrival or enhancement (include_regex) and is not about a stream that is already
# under way or fading (exclude_regex: persist, wane, taper, return to ..., reflected, negations).
# Case-insensitive. Once alerted, the same stream is not announced again until a discussion
# appears with no arrival wording (episode ends) and cooldown_minutes has passed.
# Each run saves the stream sentences it saw, and why, to health.json on the state branch.
include_regex = '(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b).*(?:arriv|onset|\bbegin|rotat|(?:expected|anticipated|forecast|predicted|likely) to (?:impact|influence|affect|enhance|increase|become))|(?:arriv|onset|\bbegin|rotat|(?:expected|anticipated|forecast|predicted|likely) to (?:impact|influence|affect|enhance|increase|become)).*(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b)|(?:enhanced|elevated|disturbed|increased|active|unsettled|stormy)\b.{0,80}\b(?:expected|anticipated|forecast|likely)\b.*(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b)'
exclude_regex = 'persist|continu|remain|\btaper|\bwan(?:e|es|ed|ing)\b|subsid|diminish|declin|decreas|weaken|\bfad(?:e|es|ed|ing)\b|\beas(?:e|es|ed|ing)\b|returns? to|no longer|not (?:expected|anticipated|forecast)|reflected|\b(?:no|neither|nor)\b.{0,40}(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b)'
# Forecast strength: the sentence (or the one after it) must name a storm level of at least min_g_level,
# e.g. "... increase to G3 (Strong) geomagnetic storm levels ...". A stream with no G-level wording,
# or a weaker one, is not alerted. 1 = alert on any stream that names a G-level.
min_g_level = 3
cooldown_minutes = 720

[geomagnetic.storm_forecast]
enabled = true
alerts_url = "https://services.swpc.noaa.gov/products/alerts.json"
min_g_level = 4                       # G4 or greater (WATCH / WARNING products)
max_age_hours = 36
cooldown_minutes = 360

[geomagnetic.kp]
enabled = true
url = "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
min_kp = 7                          # alert when Kp >= this
lookback_hours = 12

# ---------------------------------------------------------------- PROTONS
# direction "above": alert when flux > threshold (pfu)
# Once alerted, no further alert for the same channel until the flux has
# dropped back below the threshold AND cooldown_minutes has passed.

[protons.ge10mev]
enabled = true
url = "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
energy = ">=10 MeV"
threshold = 200.0
direction = "above"
lookback_minutes = 480
cooldown_minutes = 360

[protons.ge100mev]
enabled = true
url = "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
energy = ">=100 MeV"
threshold = 2.0
direction = "above"
lookback_minutes = 480
cooldown_minutes = 360

# ---------------------------------------------------------------- SOLAR WIND
# lookback_minutes should be longer than the gap between workflow runs (GitHub's scheduler runs
# every 2-6 hours in practice; see README for an external trigger). An episode ends when the
# latest reading is back within range, so a long lookback does not suppress later events.
# Sources: SWPC real-time solar wind (rtsw), one-minute rows from several spacecraft. only_active keeps
# just the spacecraft SWPC flags as active. Do not use the old products/solar-wind files (removed or
# single-reading). `field` names the column each rule reads.
# Spike filters (per rule): readings with an absolute value above max_plausible are discarded as instrument
# glitches (0 = off), then each reading is replaced by the median of the last smoothing_window one-minute
# readings (1 = off). With 5, a glitch of one or two readings cannot trigger an alert; a real event must stay
# beyond the threshold for about 3 minutes, so alerts arrive 2-3 minutes later. health.json reports what was dropped.
# direction "above": value > threshold.  direction "below": value < threshold
# (use "below" for Bz, so -40 means "more negative than -40 nT").

[solar_wind]
plasma_url = "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"
mag_url = "https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json"
only_active = true

[solar_wind.speed]
enabled = true
field = "proton_speed"
threshold = 1000.0                     # km/s
direction = "above"
smoothing_window = 5
max_plausible = 3000
lookback_minutes = 480
cooldown_minutes = 60

[solar_wind.density]
enabled = true
field = "proton_density"
threshold = 20.0                      # particles / cm^3
direction = "above"
smoothing_window = 5
max_plausible = 100
lookback_minutes = 480
cooldown_minutes = 60

[solar_wind.bt]
enabled = true
field = "bt"
threshold = 50.0                      # nT, total field
direction = "above"
smoothing_window = 5
max_plausible = 200
lookback_minutes = 480
cooldown_minutes = 60

[solar_wind.bz]
enabled = true
field = "bz_gsm"
threshold = -50.0                     # nT, GSM Bz
direction = "below"
smoothing_window = 5
max_plausible = 200
lookback_minutes = 480
cooldown_minutes = 60


# ---------------------------------------------------------------- SHOCK ARRIVAL (L1)
# Detects the arrival of an interplanetary shock at the L1 monitor 30-60 minutes before it reaches Earth.
# A candidate is a lasting jump of speed (6-minute median from 2 minutes after versus ending 2 minutes before;
# the median speed over the 7 minutes after that must stay raised: hold_jump >= hold_fraction x speed_jump), with the plasma
# compressed (density ratio >= min_density_ratio) and at least min_met of: density ratio, field (Bt) ratio and
# temperature ratio at or above the level's values. speed_jump = 0 turns a level off. Detection lags the shock by
# roughly 10 minutes because the jump must be confirmed. Spacecraft changes inside the window disqualify a candidate.
#
# Calibration (NASA OMNI 1-minute data, measured as above):
#   17:07 UT (OMNI time) 10 May 2024 superstorm shock: speed +150, density x2.3, field x3.8, temperature x8.5  -> ALERT thresholds
#     set below these (speed +120, any two of density x1.5, field x1.5, temperature x2.0).
#   17:08 UT (OMNI time) 1 Jan 2025 storm shock: speed +50, density x2.35, field x0.93 (the field was already high), temperature
#     x1.33 -> WARNING thresholds set just below these (speed +45, any two of density x1.8, field x1.3, temperature x1.25).
#   March 1989 (Quebec blackout): OMNI holds no plasma or field data for 12-14 March 1989, so it could not be used.
#     Boteler (2019, Space Weather 17, doi 10.1029/2019SW002278) confirms there was no L1 monitor in 1989. Its values are
#     estimates: shock transit speeds 760 and 1,320 km/s, and a modelled wind of about 550 km/s rising to about 983 km/s at the
#     second shock (SSC 07:43 UT, 13 March). That is a jump of roughly 430 km/s, far above the ALERT speed_jump. The paper
#     gives no density, field or temperature, so those ratios could not be checked against it.
# Run over all of 2024 and 2025 these thresholds give 3 ALERT + 21 WARNING (2024) and 2 ALERT + 3 WARNING (2025)
# detections; the OMNI files are missing about a third of the minutes, so real counts are somewhat higher. Replaying
# the production detector on the OMNI minutes alerts about 10 minutes after each step and stays stable afterwards.

[solar_wind.shock]
enabled = true
lookback_minutes = 480
hold_fraction = 0.6
hold_min_readings = 3
min_density_ratio = 1.2
distance_km = 1500000                 # L1 to Earth, used for the arrival-time estimate
link = "https://www.swpc.noaa.gov/products/real-time-solar-wind"

[solar_wind.shock.warning]
speed_jump = 45.0                     # km/s
density_ratio = 1.8
field_ratio = 1.3
temperature_ratio = 1.25
min_met = 2

[solar_wind.shock.alert]
speed_jump = 120.0                    # km/s
density_ratio = 1.5
field_ratio = 1.5
temperature_ratio = 2.0
min_met = 2

# ---------------------------------------------------------------- GEOMAGNETICALLY INDUCED CURRENTS (GIC)
# Currents induced in power grids by fast changes of the Earth's magnetic field. Two sources, each with a WARNING
# and an ALERT threshold (the alert's level is the highest threshold reached; a rise from WARNING to ALERT during
# the same episode is announced as an update):
#
#  1. dbdt: rate of change of the horizontal magnetic field (nT/min) at ground magnetometer stations, grouped by
#     region (one alert episode per region). This is a stand-in for GIC: the current in a particular grid also
#     depends on local ground conductivity and on the grid. Stations: INTERMAGNET observatories via the British
#     Geological Survey service ("gin") and USGS ("usgs"). Add or remove [[gic.dbdt.stations]] entries freely
#     (code = IAGA code, region = any name; stations sharing a region name share an alert episode). Not covered:
#     Russia (no usable public data found); South America has a single station.
#     smoothing_window / max_plausible are spike filters, as for solar wind: values above max_plausible are
#     discarded and the median of the last smoothing_window values is used (1 / 0 = off).
#     A station that has not reported for max_station_age_minutes no longer keeps an episode open.
#  2. geoelectric: NOAA SWPC 1D geoelectric field model for the US and Canada south of 60N, in mV/km (one file per
#     minute). The value judged is the min_points-th strongest grid point, so one odd point cannot trigger an alert.
#     max_nearest_station_km > 0 ignores grid points that are further than that from a magnetometer station
#     (the model is least reliable there). SWPC warns the 1D model can be substantially inaccurate in places.
#     max_files_per_run limits how many minute files are fetched when catching up after a gap.

[gic]
enabled = true
cooldown_minutes = 60
link = "https://www.spaceweather.gov/products/geoelectric-field-models-1-minute"

[gic.dbdt]
enabled = true
gin_url = "https://imag-data.bgs.ac.uk/GIN_V1/GINServices"
usgs_url = "https://geomag.usgs.gov/ws/data/"
lookback_minutes = 480
smoothing_window = 5
max_plausible = 5000
max_station_age_minutes = 60
warning_threshold = 400.0             # nT/min
alert_threshold = 800.0               # nT/min

[[gic.dbdt.stations]]
code = "BOU"
region = "North America"
source = "usgs"

[[gic.dbdt.stations]]
code = "FRD"
region = "North America"
source = "usgs"

[[gic.dbdt.stations]]
code = "NUR"
region = "Europe"
source = "gin"

[[gic.dbdt.stations]]
code = "NGK"
region = "Europe"
source = "gin"

[[gic.dbdt.stations]]
code = "FUR"
region = "Europe"
source = "gin"

[[gic.dbdt.stations]]
code = "HRN"
region = "Europe"
source = "gin"

[[gic.dbdt.stations]]
code = "BEL"
region = "Europe"
source = "gin"

[[gic.dbdt.stations]]
code = "KAK"
region = "Asia"
source = "gin"

[[gic.dbdt.stations]]
code = "MMB"
region = "Asia"
source = "gin"

[[gic.dbdt.stations]]
code = "KNY"
region = "Asia"
source = "gin"

[[gic.dbdt.stations]]
code = "CNB"
region = "Australasia"
source = "gin"

[[gic.dbdt.stations]]
code = "CTA"
region = "Australasia"
source = "gin"

[[gic.dbdt.stations]]
code = "KDU"
region = "Australasia"
source = "gin"

[[gic.dbdt.stations]]
code = "EYR"
region = "Australasia"
source = "gin"

[[gic.dbdt.stations]]
code = "VSS"
region = "South America"
source = "gin"

[gic.geoelectric]
enabled = true
listing_url = "https://services.swpc.noaa.gov/json/lists/rgeojson/US-Canada-1D/"
lookback_minutes = 60
max_files_per_run = 6
min_points = 3
max_nearest_station_km = 0
warning_threshold = 1000.0            # mV/km
alert_threshold = 1500.0              # mV/km
