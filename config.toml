# Solar & Geomagnetic Alerts RSS - configuration
# Re-read on every polling cycle: edit, save, and the next run uses the new values.
# Check your edits with:  python3 solar_alerts.py --check-config

[feed]
title = "Solar & Geomagnetic Alerts"
description = "Significant solar flares, filament eruptions, geomagnetic, proton and solar wind alerts."
link = "https://SBDSBKitchener.github.io/SolarAlert/"            # human-facing page (GitHub Pages URL)
self_url = "https://SBDSBKitchener.github.io/SolarAlert/feed.xml"  # public URL of the feed itself
output_path = "site/feed.xml"                              # published directory (GitHub Pages deploys site/)
max_items = 100
max_age_days = 14
ttl_minutes = 5

[runtime]
database = "state/solar_alerts.db"
user_agent = "solar-alerts-rss/1.0 (+https://github.com/SBDSBKitchener/SolarAlert)"   # public contact sent to NOAA/HEK
http_timeout_seconds = 20
retention_days = 90          # how long alerts stay in the database

[hek]
url = "https://www.lmsal.com/hek/her"

# ---------------------------------------------------------------- SOLAR EVENTS
# "Earth-facing" is judged from the event's Stonyhurst heliographic longitude
# (0 = disk centre, +/-90 = limb).
#   |lon| <= full_facing_max_longitude     -> "Earth-facing"
#   |lon| <= partial_facing_max_longitude  -> "partially Earth-facing (near limb)"
# unknown_location: "ignore" or "alert" when HEK has no position for the event yet.

[flares]
enabled = true
min_class = "M5.0"                    # alert on flares at or above this GOES class
lookback_hours = 12
full_facing_max_longitude = 60
partial_facing_max_longitude = 90
unknown_location = "ignore"
link = "https://www.swpc.noaa.gov/products/goes-x-ray-flux"

[filaments]
enabled = true
lookback_hours = 24
full_facing_max_longitude = 60
partial_facing_max_longitude = 90
unknown_location = "ignore"
link = "https://sdo.gsfc.nasa.gov/data/"

# ---------------------------------------------------------------- SUNSPOTS
# Alerts when an Earth-facing sunspot region has one of the listed magnetic classes.
# Source: NOAA Solar Region Summary (updated about once a day, so alerts lag by up to ~24 h).
# dangerous_classes: Hale/Mount Wilson classes, case-insensitive, exact match.
#   "BGD" = beta-gamma-delta (default). Add "GD" (gamma-delta) and/or "BD" (beta-delta)
#   if you also want those, e.g.  dangerous_classes = ["BGD", "GD", "BD"]
# max_longitude: degrees from the central meridian counted as Earth-facing (0-180).
# max_age_days: ignore a region whose latest record is older than this.
# A region alerts once per episode: no repeat while it stays qualifying, and again only after it
# has stopped qualifying AND cooldown_minutes has passed.

[sunspots]
enabled = true
url = "https://services.swpc.noaa.gov/json/solar_regions.json"
dangerous_classes = ["BGD"]
max_longitude = 60
max_age_days = 3
cooldown_minutes = 1440
link = "https://www.swpc.noaa.gov/products/solar-region-summary"

# ---------------------------------------------------------------- GEOMAGNETIC

[geomagnetic.coronal_hole]
enabled = true
url = "https://services.swpc.noaa.gov/text/discussion.txt"
# A sentence of the SWPC forecast discussion triggers an alert only if it names a stream AND
# announces an arrival or enhancement (include_regex) and is not about a stream that is already
# under way or fading (exclude_regex: persist, wane, taper, return to ..., reflected, negations).
# Case-insensitive. Once alerted, the same stream is not announced again until a discussion
# appears with no arrival wording (episode ends) and cooldown_minutes has passed.
# Each run saves the stream sentences it saw, and why, to health.json on the state branch.
include_regex = '(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b).*(?:arriv|onset|\bbegin|rotat|(?:expected|anticipated|forecast|predicted|likely) to (?:impact|influence|affect|enhance|increase|become))|(?:arriv|onset|\bbegin|rotat|(?:expected|anticipated|forecast|predicted|likely) to (?:impact|influence|affect|enhance|increase|become)).*(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b)|(?:enhanced|elevated|disturbed|increased|active|unsettled|stormy)\b.{0,80}\b(?:expected|anticipated|forecast|likely)\b.*(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b)'
exclude_regex = 'persist|continu|remain|\btaper|\bwan(?:e|es|ed|ing)\b|subsid|diminish|declin|decreas|weaken|\bfad(?:e|es|ed|ing)\b|\beas(?:e|es|ed|ing)\b|returns? to|no longer|not (?:expected|anticipated|forecast)|reflected|\b(?:no|neither|nor)\b.{0,40}(?:coronal holes?|CH HSS|high[- ]speed streams?|\bHSS\b)'
cooldown_minutes = 720

[geomagnetic.storm_forecast]
enabled = true
alerts_url = "https://services.swpc.noaa.gov/products/alerts.json"
min_g_level = 2                       # G4 or greater (WATCH / WARNING products)
max_age_hours = 36
cooldown_minutes = 360

[geomagnetic.kp]
enabled = true
url = "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
min_kp = 5                          # alert when Kp >= this
lookback_hours = 12

# ---------------------------------------------------------------- PROTONS
# direction "above": alert when flux > threshold (pfu)
# Once alerted, no further alert for the same channel until the flux has
# dropped back below the threshold AND cooldown_minutes has passed.

[protons.ge10mev]
enabled = true
url = "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
energy = ">=10 MeV"
threshold = 100.0
direction = "above"
lookback_minutes = 480
cooldown_minutes = 360

[protons.ge100mev]
enabled = true
url = "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
energy = ">=100 MeV"
threshold = 1.0
direction = "above"
lookback_minutes = 480
cooldown_minutes = 360

# ---------------------------------------------------------------- SOLAR WIND
# lookback_minutes should be longer than the gap between workflow runs (GitHub's scheduler runs
# every 2-6 hours in practice; see README for an external trigger). An episode ends when the
# latest reading is back within range, so a long lookback does not suppress later events.
# Do not use the *-5-minute.json files: they contain a single reading.
# direction "above": value > threshold.  direction "below": value < threshold
# (use "below" for Bz, so -40 means "more negative than -40 nT").

[solar_wind]
plasma_url = "https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json"
mag_url = "https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json"

[solar_wind.speed]
enabled = true
threshold = 800.0                     # km/s
direction = "above"
lookback_minutes = 480
cooldown_minutes = 60

[solar_wind.density]
enabled = true
threshold = 10.0                      # particles / cm^3
direction = "above"
lookback_minutes = 480
cooldown_minutes = 60

[solar_wind.bt]
enabled = true
threshold = 40.0                      # nT, total field
direction = "above"
lookback_minutes = 480
cooldown_minutes = 60

[solar_wind.bz]
enabled = true
threshold = -40.0                     # nT, GSM Bz
direction = "below"
lookback_minutes = 480
cooldown_minutes = 60
